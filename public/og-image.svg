<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(74,222,128,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4ade80" stop-opacity="1"/>
      <stop offset="70%" stop-color="#4ade80" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Border frame -->
  <rect x="32" y="32" width="1136" height="566" rx="12" fill="none" stroke="rgba(74,222,128,0.14)" stroke-width="1"/>

  <!-- Top accent line -->
  <rect x="200" y="32" width="800" height="1.5" fill="url(#accentLine)"/>

  <!-- Personality glyph cluster — left side decorative -->
  <!-- Vague circles -->
  <circle cx="100" cy="315" r="55" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1.2" stroke-dasharray="2 6"/>
  <circle cx="100" cy="315" r="35" fill="none" stroke="rgba(148,163,184,0.08)" stroke-width="1" stroke-dasharray="2 4"/>
  <!-- Harsh triangle -->
  <path d="M 1100 200 L 1150 290 L 1050 290 Z" fill="none" stroke="rgba(248,113,113,0.15)" stroke-width="1.2"/>
  <!-- Harvard nested chevrons -->
  <path d="M 1060 380 L 1100 450 L 1140 380" fill="none" stroke="rgba(248,113,113,0.10)" stroke-width="1.2"/>
  <path d="M 1075 400 L 1100 440 L 1125 400" fill="none" stroke="rgba(248,113,113,0.07)" stroke-width="1"/>
  <!-- Sine wave -->
  <path d="M 60 480 Q 90 455 120 480 T 180 480" fill="none" stroke="rgba(74,222,128,0.12)" stroke-width="1.2"/>
  <!-- Overlapping circles (reassuring) -->
  <circle cx="1090" cy="540" r="28" fill="none" stroke="rgba(96,165,250,0.10)" stroke-width="1"/>
  <circle cx="1115" cy="540" r="28" fill="none" stroke="rgba(96,165,250,0.07)" stroke-width="1"/>

  <!-- Eyebrow -->
  <text x="600" y="210" text-anchor="middle"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="14" letter-spacing="6" fill="#4ade80" opacity="0.9">
    AI-POWERED LECTURE REVISION
  </text>

  <!-- Main headline — Slide -->
  <text x="600" y="330" text-anchor="middle"
    font-family="'Montserrat', 'Arial Black', sans-serif"
    font-weight="900" font-size="118" letter-spacing="-4"
    fill="#faf7f0">
    Slide
  </text>

  <!-- IQ in accent -->
  <text x="600" y="330" text-anchor="middle"
    font-family="'Montserrat', 'Arial Black', sans-serif"
    font-weight="900" font-size="118" letter-spacing="-4"
    fill="url(#textGrad)">
    &#160;&#160;&#160;&#160;&#160;&#160;&#160;IQ
  </text>

  <!-- Divider -->
  <rect x="480" y="355" width="240" height="1" fill="rgba(74,222,128,0.25)"/>

  <!-- Subheading -->
  <text x="600" y="410" text-anchor="middle"
    font-family="'Lora', Georgia, serif"
    font-size="22" fill="rgba(250,247,240,0.60)" font-style="italic">
    Turn any lecture into a brutal quiz.
  </text>

  <!-- Feature chips -->
  <rect x="290" y="450" width="148" height="34" rx="5" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.22)" stroke-width="1"/>
  <text x="364" y="472" text-anchor="middle"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="11" letter-spacing="2" fill="rgba(250,247,240,0.70)">
    8 LECTURERS
  </text>

  <rect x="454" y="450" width="148" height="34" rx="5" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.22)" stroke-width="1"/>
  <text x="528" y="472" text-anchor="middle"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="11" letter-spacing="2" fill="rgba(250,247,240,0.70)">
    MCQ + THEORY
  </text>

  <rect x="618" y="450" width="148" height="34" rx="5" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.22)" stroke-width="1"/>
  <text x="692" y="472" text-anchor="middle"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="11" letter-spacing="2" fill="rgba(250,247,240,0.70)">
    SCORED
  </text>

  <rect x="782" y="450" width="148" height="34" rx="5" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.22)" stroke-width="1"/>
  <text x="856" y="472" text-anchor="middle"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="11" letter-spacing="2" fill="rgba(250,247,240,0.70)">
    FREE
  </text>

  <!-- Bottom URL -->
  <text x="600" y="570" text-anchor="middle"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="13" letter-spacing="3" fill="rgba(74,222,128,0.45)">
    slideiq.vercel.app
  </text>
</svg>
